name: screenshots

# Runs the Lili & Friends app on emulators of different sizes and Android versions, photographs
# every screen, and publishes the pictures to the "screenshots" branch for review.
on:
  push:
    branches: [lili-arabic, main]
    paths: ["lili-app/**", "robot-path/app/**", "kangaroo-hops/app/**", "pattern-machine/app/**", "balance-scale/app/**", ".github/workflows/screenshots.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 1-small-old-phone-api21, api: 21, target: default, arch: x86, profile: "Nexus One", lang: en }
          - { name: 2-phone-api29, api: 29, target: default, arch: x86, profile: pixel_4, lang: en }
          - { name: 3-phone-api35-arabic, api: 35, target: google_apis, arch: x86_64, profile: pixel_7, lang: ar }
          - { name: 4-tablet-api34-arabic, api: 34, target: google_apis, arch: x86_64, profile: pixel_tablet, lang: ar }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install the pinned Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;37.0.0" > /dev/null

      - name: Build the debug app
        working-directory: lili-app
        run: ./gradlew :app:assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Photograph every screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash lili-app/tools/screenshots.sh ${{ matrix.name }} ${{ matrix.lang }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.name }}
          path: shots/

  publish:
    needs: shots
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: shots-*
          merge-multiple: true
          path: /tmp/shots

      - name: Publish to the screenshots branch
        run: |
          src=$(git rev-parse --short HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan screenshots
          git rm -rf -q .
          cp -r /tmp/shots/. .
          echo "Screenshots of commit $src" > README.md
          git add -A
          git commit -q -m "Screenshots of $src"
          git push -f origin screenshots
