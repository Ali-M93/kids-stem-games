name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  game:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        game: [robot-path, pattern-machine, kangaroo-hops, balance-scale]
    defaults:
      run:
        working-directory: ${{ matrix.game }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Puzzle logic (plain JDK)
        run: tools/check_logic.sh

      - name: Install the pinned Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;37.0.0" > /dev/null

      # lintDebug fails the build on any API call newer than minSdk 19.
      - name: Build and lint
        run: ./gradlew assembleDebug lintDebug
      - name: Show lint errors as annotations
        if: failure()
        run: |
          for f in $(find . -name 'lint-results-*.xml' -path '*build/reports*'); do
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for i in ET.parse(sys.argv[1]).getroot().iter('issue'):
              if i.get('severity') not in ('Error', 'Fatal'): continue
              loc = i.find('location')
              f = loc.get('file', '') if loc is not None else ''
              line = loc.get('line', '1') if loc is not None else '1'
              print('::error file=%s,line=%s::%s: %s' % (f, line, i.get('id'), i.get('message')))
          PY
          done

      - name: minSdk 19, no permissions, v1 signature
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          bt="$ANDROID_HOME/build-tools/37.0.0"
          "$bt/aapt2" dump badging "$apk" | grep -x "minSdkVersion:'19'"
          perms=$("$bt/aapt2" dump permissions "$apk")
          echo "$perms"
          # Not `! grep`: bash -e ignores a negated command unless it is the step's last line.
          if echo "$perms" | grep -q 'uses-permission'; then echo "APK requests permissions"; exit 1; fi
          # Android 4.4 only checks v1 (JAR) signatures.
          "$bt/apksigner" verify -v --min-sdk-version 19 "$apk" | grep "v1 scheme (JAR signing): true"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.game }}
          path: ${{ matrix.game }}/app/build/outputs/apk/debug/app-debug.apk

  # All four games in one app, with players and journey maps.
  lili-app:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lili-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install the pinned Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;37.0.0" > /dev/null

      - name: Build and lint
        run: ./gradlew :app:assembleDebug :app:lintDebug
      - name: Show lint errors as annotations
        if: failure()
        run: |
          for f in $(find . -name 'lint-results-*.xml' -path '*build/reports*'); do
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for i in ET.parse(sys.argv[1]).getroot().iter('issue'):
              if i.get('severity') not in ('Error', 'Fatal'): continue
              loc = i.find('location')
              f = loc.get('file', '') if loc is not None else ''
              line = loc.get('line', '1') if loc is not None else '1'
              print('::error file=%s,line=%s::%s: %s' % (f, line, i.get('id'), i.get('message')))
          PY
          done

      - name: minSdk 19, no permissions, one launcher
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          bt="$ANDROID_HOME/build-tools/37.0.0"
          "$bt/aapt2" dump badging "$apk" | grep -x "minSdkVersion:'19'"
          "$bt/aapt2" dump badging "$apk" | grep "launchable-activity"
          test "$("$bt/aapt2" dump badging "$apk" | grep -c "launchable-activity")" = 1
          perms=$("$bt/aapt2" dump permissions "$apk")
          if echo "$perms" | grep -q 'uses-permission'; then echo "APK requests permissions"; exit 1; fi
          "$bt/apksigner" verify -v --min-sdk-version 19 "$apk" | grep "v1 scheme (JAR signing): true"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lili-app
          path: lili-app/app/build/outputs/apk/debug/app-debug.apk
